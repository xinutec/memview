# The console is a workspace member and NOT a feature of this package, so that
# no configuration of the viewer can turn into a way to execute code on the Mac.
# It links nothing from here and ships in no image; see docs/agent-console.md.
[workspace]
members = ["console"]

[package]
# Adding src/bin/memory-lint.rs made `cargo run` ambiguous, which silently broke
# scripts/dev.sh — it exec'd `cargo run`, cargo refused to choose, and the dev
# server simply never started. The server is the default; the linter is asked
# for by name.
default-run = "memview"
name = "memview"
version = "0.1.0"
edition = "2024"

# Read-only web viewer for the Claude memory markdown corpus (frontmatter +
# [[wikilink]] cross-references). Auth is Nextcloud OAuth2 (identity-only,
# copied from the `messages` app) with a health-style public share token;
# both are inert unless configured so local dev serves open. See README.md.

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "trace"] }
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
comrak = "0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
base64 = "0.22"
rand = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = "0.3"
url = "2"
pest = "2.8"
pest_derive = "2.8"

[dev-dependencies]
# Tried against the pest grammar and NOT adopted — `examples/tree-sitter-probe.rs`
# has the numbers. A dev-dependency on purpose: the probe is worth keeping so the
# decision can be re-checked when the upstream heredoc bug is fixed, but the
# product must not carry a C toolchain for a measurement.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tempfile = "3"
# Drives the router in-process for the access-control tests: the owner/share
# split is a security property and should not rest on reading the code.
tower = { version = "0.5", features = ["util"] }
