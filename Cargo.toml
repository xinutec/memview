# The console is a workspace member and NOT a feature of this package, so that
# no configuration of the viewer can turn into a way to execute code on the Mac.
# It links nothing from here and ships in no image; see docs/agent-console.md.
#
# `reader` is the one thing both of them may link, and it does not weaken that:
# it is a leaf that runs nothing, serves nothing and opens nothing, so there is
# no configuration of it to get wrong. Its own Cargo.toml is where that is kept
# true. Sharing it is what stops the two from re-deriving the same transcript
# knowledge separately, which has already produced one bug — see reader/src/lib.rs.
#
# `bash-oracle` spawns bash to check the syntax tree against bash's own parse.
# It is a member rather than a module of `reader` so that the leaf claim above
# stays literally true; see docs/execution-model.md.
#
# ⚠ **A member added here must also be added to flake.nix AND the Dockerfile.**
# Cargo loads every member's manifest before building any package, so a member
# absent from a build's source tree fails that build with "failed to load
# manifest for workspace member" — including builds that link none of it.
# `scripts/workspace-members.sh` checks all three lists and is a gate row,
# because this comment's predecessor in the Dockerfile did not stop it happening
# twice.
[workspace]
members = ["bash-oracle", "console", "reader"]

[package]
# Adding src/bin/memory-lint.rs made `cargo run` ambiguous, which silently broke
# scripts/dev.sh — it exec'd `cargo run`, cargo refused to choose, and the dev
# server simply never started. The server is the default; the linter is asked
# for by name.
default-run = "memview"
# ⚠ **Cargo's freshness check walks THIS PACKAGE'S DIRECTORY, and this one is the
# repository root** — so every file under `frontend/` was an input to the Rust
# build. Measured 2026-09-21: `touch` one generated `.ts` file and `cargo doc
# --workspace` went from 0.6s to 47.6s. With this line, 0.8s.
#
# That is what the gate was paying on an ORDINARY commit: the rustdoc row's 44s
# was attributed to `gen-types` writing inside the crates, and it was really
# any frontend edit at all — which is most commits. `gen-types` exports to a
# scratch directory and never did write inside a crate.
#
# Only directories no Rust target reads. `console/tests/fixtures` is
# `include_str!`d and is a DIFFERENT package's root, untouched by this.
exclude = ["android", "docs", "frontend"]
name = "memview"
version = "0.1.0"
edition = "2024"

# Read-only web viewer for the Claude memory markdown corpus (frontmatter +
# [[wikilink]] cross-references). Auth is Nextcloud OAuth2 (identity-only,
# copied from the `messages` app), inert unless configured so local dev serves
# open. See README.md.

[dependencies]
# ⚠ **The locks, and not `std::sync`'s.** A std lock poisons when a thread panics
# holding it, and every later reader gets an `Err` saying only "somebody else
# crashed". The state behind these locks is a cache of what is on disk, so there
# was nothing to do but unwrap and read it again. These do not poison.
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
# `ServiceBuilder`, to layer a Cache-Control header onto the static service
# alone. `SetResponseHeaderLayer` has no `.layer()` of its own.
tower = "0.5"
axum-extra = { version = "0.12", features = ["cookie"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
comrak = "0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
base64 = "0.23"
rand = "0.10"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = "0.3"
url = "2"
reader = { path = "reader" }

[dev-dependencies]
tempfile = "3"
# Drives the router in-process for the access-control tests: who may read is a
# security property and should not rest on reading the code.
tower = { version = "0.5", features = ["util"] }

# The fleet's `[lints]` baseline (dev-lint docs/standards.md §7): every member
# takes it with `lints.workspace = true`, so clippy is no weaker here than
# anywhere else. `deny`, not `forbid`, for unsafe: the console drives sessions through libc,
# and edition 2024 makes env::set_var one
# — each such module carries an `#![expect(unsafe_code, reason)]` at its top,
# the ledgered shape (standards.md §3), so a new one is a visible edit.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true
