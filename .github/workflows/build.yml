---
name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"
  workflow_dispatch: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: rust:1.98-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  fe-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ui-check
      - run: node ../scripts/graph-report.mjs

  # What the local gate stopped running (2026-10-02): expensive and almost never
  # the one to fail — over 30 days the two package rows cost 1,824 gate-minutes
  # for two failures, the drafts row 270 for one. The store is cached on the
  # lockfiles, so a run rebuilds memview and not its toolchain or crates.
  nix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      - uses: Swatinem/rust-cache@v2
      # The binary this repo publishes, and the CLI home-manager installs.
      - run: nix build --no-warn-dirty --no-link .#console .#sessions
      # Drafts cross between two devices: the real console binary and a browser.
      - run: nix develop --no-warn-dirty -c pnpm --dir frontend install --frozen-lockfile
      - run: nix develop --no-warn-dirty -c ./scripts/sync-check.sh

  image:
    needs: [verify, fe-verify]
    # Docker Hub auth comes from repo secrets; the GITHUB_TOKEN only reads.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/memview:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=xinutec/memview:cache
          cache-to: type=registry,ref=xinutec/memview:cache
