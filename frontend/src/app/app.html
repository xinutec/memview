@if (auth.needsSignIn()) {
  <div class="signin">
    <h1>memory</h1>
    <p>Claude's memory of our work, rendered.</p>
    <a mat-flat-button [href]="loginHref()">Sign in with Nextcloud</a>
  </div>
} @else if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else {
  <mat-toolbar class="bar">
    <button mat-icon-button [matMenuTriggerFor]="nav" aria-label="Menu">
      <mat-icon>menu</mat-icon>
    </button>
    <!-- One trigger rather than a row of icons: the bar had five, each readable
         only by guessing what its glyph meant, and every new destination made
         the brand and the icons compete for the same phone-width line. A menu
         also affords the thing icons cannot — a written label. -->
    <mat-menu #nav="matMenu">
      <a mat-menu-item routerLink="/search">
        <mat-icon>search</mat-icon>
        <span>Search</span>
      </a>
      <a mat-menu-item routerLink="/all">
        <mat-icon>list</mat-icon>
        <span>All memories</span>
      </a>
      <a mat-menu-item routerLink="/graph">
        <mat-icon>hub</mat-icon>
        <span>Link graph</span>
      </a>
      @if (me(); as user) {
        @if (!user.shared && user.auth_enabled) {
          <a mat-menu-item routerLink="/sharing">
            <mat-icon>share</mat-icon>
            <span>Share link</span>
          </a>
          <button mat-menu-item (click)="signOut()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
          </button>
        }
      }
    </mat-menu>
    <a routerLink="/" class="brand">memory</a>
  </mat-toolbar>

  <main class="content">
    <router-outlet />
  </main>
}
