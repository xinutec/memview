<!-- What is about to be sent, above the box rather than inside it: a thumbnail in
     a row that changes height moves the send button under a thumb. Held rather
     than sent on choosing — the words about a screenshot are usually the point. -->
@if (held(); as picture) {
  <div class="chosen">
    <img class="thumb" [src]="picture.preview" alt="the image about to be sent" />
    <span class="about"
      >{{ picture.width }}×{{ picture.height }} · {{ weight(picture.bytes) }}</span
    >
    <button
      matIconButton
      type="button"
      aria-label="do not send this image"
      (click)="discard.emit()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
}
@if (trouble(); as why) {
  <p class="trouble">{{ why }}</p>
}
<form class="composer" (submit)="$event.preventDefault(); send.emit()">
  <!-- `subscriptSizing="dynamic"` is load-bearing: a form field otherwise reserves an
       invisible hint row, and the send button, aligned to `flex-end`, sits a line
       below the visible box. -->
  <!-- The input is the control; the button only presses it — a bare file input
       cannot be made 48px. `accept="image/*"` is what makes Android offer the
       camera. In the wrapper app this needs `onShowFileChooser`, implemented in
       `ui-harness/android`, so it needs a build of the APK and not only the bundle. -->
  <input
    #picker
    class="picker"
    type="file"
    accept="image/*"
    aria-hidden="true"
    tabindex="-1"
    (change)="took(picker)"
  />
  <mat-form-field appearance="outline" class="box" subscriptSizing="dynamic">
    <mat-label>say something</mat-label>
    <!-- Grows with what is typed, capped at a third of the screen. `Ctrl+Enter` stays for the desk and is not the way in: a soft
         keyboard has no Ctrl, and Enter is a newline. -->
    <textarea
      matInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="6"
      [(ngModel)]="text"
      name="text"
      (keydown.control.enter)="send.emit()"
    ></textarea>
  </mat-form-field>
  <!-- Beside the send, not inside the field as `matIconSuffix`: Material centres a
       suffix vertically and this field autosizes to six rows, so the glyph would
       float mid-box and cost a column on every line of a 412px screen. -->
  <button matIconButton type="button" aria-label="show an image" (click)="picker.click()">
    <mat-icon>image</mat-icon>
  </button>
  <!-- Both plain. A `matMiniFab` is a rounded square in M3 beside an icon button
       at `corner-full`, and Angular Material has no filled icon button
       (angular/components#33091). Not a filled text button either: `min-width:
       64px` strands a single glyph in a pill — DL-ANGULAR-ICON-ONLY-TEXT-BUTTON. -->
  <button
    class="send"
    matIconButton
    type="submit"
    aria-label="send"
    [disabled]="sending() || (!text() && !held())"
  >
    <mat-icon>send</mat-icon>
  </button>
</form>
