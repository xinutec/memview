<!-- What is about to be sent, above the box rather than inside it: a thumbnail in
     a row that changes height moves the send button under a thumb. Held rather
     than sent on choosing — the words about a screenshot are usually the point.
     Once something is held the slot beside the box is send, so another picture
     is added from here. -->
@if (held().length) {
  <div class="chosen">
    @for (picture of held(); track $index) {
      <div class="tile">
        <img class="thumb" [src]="picture.preview" alt="an image about to be sent" />
        <button
          class="put-down"
          matIconButton
          type="button"
          aria-label="do not send this image"
          (click)="discard.emit($index)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
    @if (held().length < most) {
      <button
        class="tile more"
        type="button"
        aria-label="add another image"
        (click)="picker.click()"
      >
        <mat-icon>add_photo_alternate</mat-icon>
      </button>
    }
    <span class="about">{{ about() }}</span>
  </div>
}
@if (trouble(); as why) {
  <p class="trouble">{{ why }}</p>
}
<form class="composer" (submit)="$event.preventDefault(); send.emit()">
  <!-- `subscriptSizing="dynamic"` is load-bearing: a form field otherwise reserves an
       invisible hint row, and the send button, aligned to `flex-end`, sits a line
       below the visible box. -->
  <!-- The input is the control; the button only presses it — a bare file input
       cannot be made 48px. `accept="image/*"` is what makes Android offer the
       camera. In the wrapper app this needs `onShowFileChooser`, implemented in
       `ui-harness/android`, so it needs a build of the APK and not only the bundle. -->
  <input
    #picker
    class="picker"
    type="file"
    accept="image/*"
    multiple
    aria-hidden="true"
    tabindex="-1"
    (change)="took(picker)"
  />
  <mat-form-field appearance="outline" class="box" subscriptSizing="dynamic">
    <mat-label>say something</mat-label>
    <!-- Grows with what is typed, capped at a third of the screen. `Ctrl+Enter` stays for the desk and is not the way in: a soft
         keyboard has no Ctrl, and Enter is a newline. -->
    <textarea
      matInput
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="6"
      [(ngModel)]="text"
      name="text"
      (keydown.control.enter)="send.emit()"
    ></textarea>
  </mat-form-field>
  <!-- One slot under the thumb, as messengers do: the picture until there is
       something to send, then send. Two buttons rather than one that swaps, so
       each keeps its own `type` and label. Not `matIconSuffix` for the picture:
       Material centres a suffix in a box that grows to six rows. -->
  @if (ready()) {
    <button class="slot send" matIconButton type="submit" aria-label="send" [disabled]="sending()">
      <mat-icon>send</mat-icon>
    </button>
  } @else {
    <button
      class="slot"
      matIconButton
      type="button"
      aria-label="add an image"
      (click)="picker.click()"
    >
      <mat-icon>add_photo_alternate</mat-icon>
    </button>
  }
</form>
