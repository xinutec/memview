<!-- What is about to be sent, above the box rather than inside it: a thumbnail in
     a row that changes height moves the send button under a thumb. Held rather
     than sent on choosing — the words about a screenshot are usually the point. -->
@if (held().length) {
  <div class="chosen">
    @for (picture of held(); track $index) {
      <div class="tile">
        <img class="thumb" [src]="picture.preview" alt="an image about to be sent" />
        <button
          class="put-down"
          matIconButton
          type="button"
          aria-label="do not send this image"
          (click)="discard.emit($index)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
    <span class="about">{{ about() }}</span>
  </div>
}
@if (trouble(); as why) {
  <p class="trouble">{{ why }}</p>
}
<form class="composer" (submit)="$event.preventDefault(); send.emit()">
  <!-- The input is the control; the buttons only press it — a bare file input
       cannot be made 48px. `accept="image/*"` is what makes Android offer the
       camera. In the wrapper app this needs `onShowFileChooser`, implemented in
       `ui-harness/android`, so it needs a build of the APK and not only the bundle. -->
  <input
    #picker
    class="picker"
    type="file"
    accept="image/*"
    multiple
    aria-hidden="true"
    tabindex="-1"
    (change)="took(picker)"
  />
  <!-- A pill as messengers draw it, not a Material field: its floating label and
       outline are chrome a one-line box does not need. -->
  <div class="box" matAutocompleteOrigin #pill="matAutocompleteOrigin">
    <!-- Grows with what is typed by CSS (`field-sizing`), not the CDK autosize,
         which rewrote the box on every window resize and put the cursor at the
         end. `Ctrl+Enter` stays for the desk and is not the way in: a soft
         keyboard has no Ctrl, and Enter is a newline. -->
    <!-- A slash command completes from what the session said it can be told: its
         commands, then the chosen one's values. See `suggest`. -->
    <textarea
      #field
      rows="1"
      [(ngModel)]="text"
      name="text"
      placeholder="say something"
      [matAutocomplete]="completion"
      [matAutocompleteConnectedTo]="pill"
      [matAutocompleteDisabled]="suggestions().length === 0"
      (keydown.control.enter)="send.emit()"
    ></textarea>
    <mat-autocomplete
      #completion="matAutocomplete"
      class="completion"
      (optionSelected)="picked($event.option.value)"
    >
      @for (row of suggestions(); track row.label) {
        <mat-option [value]="row.fill" [disabled]="!row.fill">
          <span class="completion-row">
            <span class="completion-label">{{ row.label }}</span>
            @if (row.detail) {
              <span class="completion-detail">{{ row.detail }}</span>
            }
          </span>
        </mat-option>
      }
    </mat-autocomplete>
    <!-- Once the slot is send, the picture moves in here, so one can be added
         after typing, or beside another. -->
    @if (ready() && held().length < most) {
      <button matIconButton type="button" aria-label="add an image" (click)="picker.click()">
        <mat-icon>add_photo_alternate</mat-icon>
      </button>
    }
  </div>
  <!-- One slot under the thumb: the picture until there is something to send,
       then send. Two buttons rather than one that swaps, so each keeps its own
       `type` and label. -->
  @if (ready()) {
    <button class="slot send" matIconButton type="submit" aria-label="send" [disabled]="sending()">
      <mat-icon>send</mat-icon>
    </button>
  } @else {
    <button
      class="slot"
      matIconButton
      type="button"
      aria-label="add an image"
      (click)="picker.click()"
    >
      <mat-icon>add_photo_alternate</mat-icon>
    </button>
  }
</form>
