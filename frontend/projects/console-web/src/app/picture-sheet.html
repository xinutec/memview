<!-- The address first, because a conversation holds several renders and they
     differ only in the name. Ellipsised from the left: what changes between two
     of them is the end of the path, and the host is what they have in common. -->
<header class="what">
  <!-- ⚠ **`<bdi>` and not bare text.** The span is `direction: rtl` so the cut
       falls at the START of a long address; without an isolate, the bidi
       algorithm then treats the leading `/` of a path as a neutral character and
       moves it to the other end — `/home/…/room.png` was drawn as
       `home/…/room.png/`, which reads as a directory. The isolate keeps the
       address's own order while leaving the container's to decide which end
       overflows. -->
  <span class="where" [title]="url"
    ><bdi>{{ url }}</bdi></span
  >
  <button matIconButton type="button" aria-label="close this picture" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</header>

@if (trouble(); as why) {
  <!-- The console's own sentence, not a broken-image glyph. The two things this
       usually means — the render server has been stopped, or the file was
       re-rendered under another name — need different answers from the person
       reading it. -->
  <p class="trouble">
    <mat-icon>broken_image</mat-icon>
    {{ why }}
  </p>
} @else if (at(); as src) {
  <!-- A button, so a tap is not the only way in: it takes focus, and Enter on it
       is the same toggle. The continuous gestures are on top of that rather than
       instead of it — see `zoom.ts` for the arithmetic and the handlers below
       for which pointer means what.

       ⚠ **`touch-action: none` is in the stylesheet and is load-bearing.**
       Without it the browser keeps the pinch for itself and the pointer stream
       stops mid-gesture. -->
  <button
    class="frame"
    #frame
    type="button"
    [attr.aria-label]="close_up() ? 'show the whole picture' : 'look closer at this picture'"
    (pointerdown)="took($event)"
    (pointermove)="drew($event)"
    (pointerup)="let_go($event)"
    (pointercancel)="let_go($event)"
    (wheel)="rolled($event)"
    (click)="tapped($event)"
  >
    <img
      #picture
      [src]="src"
      [alt]="'a picture from ' + url"
      [style.transform]="drawn()"
      (load)="measured()"
    />
  </button>
} @else {
  <!-- Down a tunnel to a phone, so this is seconds rather than an instant. -->
  <mat-progress-bar mode="indeterminate" />
}
