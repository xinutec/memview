<!-- The address first, ellipsised from the left: renders differ at the end of the path. -->
<header class="what">
  <!-- `<bdi>`, not bare text: the span is `direction: rtl` so the cut falls at the
       START, and without an isolate the bidi algorithm moves a leading `/` to the
       other end. -->
  <span class="where" [title]="url"
    ><bdi>{{ url }}</bdi></span
  >
  <button matIconButton type="button" aria-label="close this picture" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</header>

@if (trouble(); as why) {
  <!-- The console's own sentence, not a broken-image glyph: a stopped render server
       and a file re-rendered under another name need different answers. -->
  <p class="trouble">
    <mat-icon>broken_image</mat-icon>
    {{ why }}
  </p>
} @else if (at(); as src) {
  <!-- A button, so Enter is the same toggle as a tap; the gestures sit on top — see
       `zoom.ts`. `touch-action: none` in the stylesheet is load-bearing, or the
       browser keeps the pinch for itself. -->
  <button
    class="frame"
    #frame
    type="button"
    [attr.aria-label]="close_up() ? 'show the whole picture' : 'look closer at this picture'"
    (pointerdown)="took($event)"
    (pointermove)="drew($event)"
    (pointerup)="let_go($event)"
    (pointercancel)="let_go($event)"
    (wheel)="rolled($event)"
    (click)="tapped($event)"
  >
    <img
      #picture
      [src]="src"
      [alt]="'a picture from ' + url"
      [style.transform]="drawn()"
      (load)="measured()"
    />
  </button>
} @else {
  <!-- Down a tunnel to a phone, so this is seconds. -->
  <mat-progress-bar mode="indeterminate" />
}
