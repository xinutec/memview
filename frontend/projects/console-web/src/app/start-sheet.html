<h2 class="what">Start a session</h2>

@if (trouble(); as what) {
  <p class="trouble">{{ what }}</p>
}

<mat-form-field appearance="outline" class="where">
  <mat-label>where</mat-label>
  <input matInput [(ngModel)]="dir" placeholder="/path/to/a/repository" />
</mat-form-field>

<!-- Inline, not an autocomplete panel and not a `<datalist>`: both are overlays,
     which a bottom sheet clips and is covered by — the panel sits on the start
     button. Matching is on the last path element, so the default offers nothing
     and `mem` finds `memview`. -->
@if (suggestions(); as found) {
  @if (found.length) {
    <div class="suggestions" role="listbox" aria-label="repositories">
      @for (repo of found; track repo) {
        <button type="button" role="option" [attr.aria-selected]="false" (click)="dir.set(repo)">
          {{ shortened(repo) }}
        </button>
      }
    </div>
  }
}

<!-- No opening instruction: it would duplicate the composer this sheet navigates
     straight to. -->
<!-- Says it is happening, as `rename-sheet` does: spawning a CLI takes a moment,
     and a button that only greys out reads as unavailable rather than as busy. -->
<button matButton="filled" class="go" (click)="start()" [disabled]="starting() || !dir()">
  <mat-icon>play_arrow</mat-icon>
  {{ starting() ? 'starting…' : 'start a session' }}
</button>
