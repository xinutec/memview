<h2 class="what">Start a session</h2>

@if (trouble(); as what) {
  <p class="trouble">{{ what }}</p>
}

<mat-form-field appearance="outline" class="where">
  <mat-label>where</mat-label>
  <input matInput [(ngModel)]="dir" list="start-repos" placeholder="/path/to/a/repository" />
</mat-form-field>
<datalist id="start-repos">
  @for (repo of repos; track repo) {
    <option [value]="repo"></option>
  }
</datalist>

<!-- ⚠ **No opening instruction here, on purpose.** It was optional, it duplicated
     the composer this sheet navigates straight to, and it did the same thing:
     `POST /api/sessions` with a prompt sends exactly the message the composer
     would. So it bought nothing and cost a textarea on a phone — and the resume
     path had already dropped its copy for the same reason. -->
<button matButton="filled" class="go" (click)="start()" [disabled]="starting() || !dir()">
  <mat-icon>play_arrow</mat-icon>
  start a session
</button>
