@if (trouble(); as what) {
  <p class="trouble">{{ what }}</p>
}
@if (entries() === undefined) {
  @if (!trouble()) {
    <mat-progress-bar mode="indeterminate" />
  }
} @else {
  <ol
    app-transcript
    class="transcript"
    [blocks]="blocks()"
    [folding]="folding"
    [pictureAt]="pictureAt"
    asker="workflow"
    (parse)="parse($event)"
    (diff)="diff($event)"
  >
    @if (more()) {
      <li class="earlier">
        <button matButton type="button" [disabled]="loading()" (click)="earlier()">
          {{ loading() ? 'reading…' : 'earlier' }}
        </button>
      </li>
    }
  </ol>
}
