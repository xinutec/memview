<ng-content />
@for (block of blocks(); track block.kind === 'one' ? block.entry : block.key) {
  @if (block.kind === 'tools') {
    <li app-run [block]="block" [folding]="folding()" [now]="now()"></li>
  }
  @for (entry of shown(block); track entry) {
    <li
      app-entry
      [entry]="entry"
      [folding]="folding()"
      [deaf]="deaf()"
      [now]="now()"
      [full]="full()"
      [pictureAt]="pictureAt()"
      [asker]="asker()"
      (parse)="parse.emit($event)"
      (diff)="diff.emit($event)"
      (enlarge)="enlarge.emit($event)"
    ></li>
  }
}
