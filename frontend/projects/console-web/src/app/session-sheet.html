<h2 class="who">{{ title }}</h2>

<!-- A description list, stacked: a 412px screen cannot hold a label beside an
     absolute path. -->
<dl class="facts">
  @for (fact of facts; track fact.label) {
    <dt>{{ fact.label }}</dt>
    <dd [class.mono]="fact.mono">
      {{ fact.value }}
      <!-- Under the value rather than beside it, for the same reason. -->
      @if (fact.note; as note) {
        <span class="note">{{ note }}</span>
      }
    </dd>
  }
</dl>
