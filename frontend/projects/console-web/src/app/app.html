<!-- The bar every app draws (`@xinutec/ui-scaffold`): the list's `menu` and name at
     the root, an arrow up and the screen's name below it, from the route. -->
<ui-scaffold title="console" [menu]="elsewhere">
  <!-- On every screen, and before the screen's own actions. -->
  <ng-container [ngTemplateOutlet]="keepAwake" />
</ui-scaffold>

<!-- A menu of things that are about the whole corpus rather than a session. -->
<mat-menu #elsewhere="matMenu">
  <!-- Named as the viewer names it. -->
  <a mat-menu-item routerLink="/reader">
    <mat-icon>data_object</mat-icon>
    <span>Reader</span>
  </a>
</mat-menu>

<!-- A session's actions, while one is open: the name is the headline, not a
     control, so the details sheet is the first item in the ⋮ menu. -->
@if (here.at()) {
  <ng-template scaffoldActions>
    @if (here.open(); as open) {
      <button
        matIconButton
        [matMenuTriggerFor]="menu"
        [attr.aria-label]="'what to do with ' + (open.name ?? 'this session')"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <!-- The count rides the poll, which is cheap (`console/src/tasks.rs`), rather
           than a fetch when the menu opens. -->
      <mat-menu #menu="matMenu" class="session-menu">
        <!-- First, because it is the only item here that reads rather than acts. -->
        <button mat-menu-item aria-haspopup="dialog" (click)="details(open)">
          <mat-icon>info</mat-icon>
          <span>Details</span>
        </button>
        <!-- Here rather than floating over the transcript: this is what somebody reaches
             for when they have given up scrolling. See [[JumpSheet]]. -->
        <button mat-menu-item aria-haspopup="dialog" (click)="goTo(open)">
          <mat-icon>my_location</mat-icon>
          <span>Go to…</span>
        </button>
        <!-- The session's own list — see [[TasksSheet]]. -->
        <button mat-menu-item aria-haspopup="dialog" (click)="tasks(open)">
          <mat-icon>checklist</mat-icon>
          <!-- How much is open of what it holds. Absent until counted, and absent for a
               conversation never handed anything. -->
          <span>Tasks</span>
          @if (taskCount(); as count) {
            <span class="tally">
              @if (count.total) {
                {{ count.open }}/{{ count.total }}
              }
              <!-- What this conversation has left in the built-in store, which the sheet
                   cannot show. The same figure is on the card. -->
              @if (count.stray) {
                <span class="stray">({{ count.stray }})</span>
              }
            </span>
          }
        </button>
        <!-- Here rather than as a `/rename`: a slash command sent to a working session is
             handed to the model as words. This goes over the control channel — see
             `protocol::rename`. -->
        <button mat-menu-item (click)="rename(open)">
          <!-- Not `edit`, which is the `acceptEdits` mode's icon on the row directly below;
               and not `drive_file_rename_outline`, also a pencil. A name-plate reads apart. -->
          <mat-icon>label</mat-icon>
          <span>Rename</span>
        </button>
        <!-- One row, not six: the modes have their own sheet. See [[ModesSheet]]. -->
        <button mat-menu-item (click)="chooseMode(open)">
          <!-- The mode's own icon when there is one, a neutral one when the runner has not said. -->
          <mat-icon [class.loud]="loud()">{{ modeIcon() ?? 'shield' }}</mat-icon>
          <span>Asks permission</span>
          @if (mode(); as now) {
            <span class="current" [class.loud]="loud()">{{ now }}</span>
          }
        </button>
        @if (open.alive) {
          <!-- Last, and behind a divider: the one thing here that cannot be undone. -->
          <mat-divider />
          <button mat-menu-item (click)="stop(open.id)">
            <mat-icon>stop</mat-icon>
            <span>Stop this session</span>
          </button>
        }
      </mat-menu>
    }
  </ng-template>
}

<!-- On both screens, one template: watching is done with no hands, and waking the
     screen by hand is also the gesture that stops the transcript following. Absent,
     not disabled, where the browser has no wake lock. -->
<ng-template #keepAwake>
  @if (awake.possible) {
    <button
      matIconButton
      class="awake"
      [attr.aria-pressed]="awake.lit()"
      [attr.aria-label]="awake.lit() ? 'let the screen sleep' : 'keep the screen on'"
      (click)="awake.toggle()"
    >
      <!-- A moon the screen may sleep under, struck through while it may not — two
           glyphs, since a tint on a coloured toolbar is not readable in daylight. Not
           `lightbulb_outline`: it is in the codepoints but not in the bundled ligature
           font (DL-ANGULAR-ICON-EXISTS). -->
      <mat-icon>{{ awake.lit() ? 'bedtime_off' : 'bedtime' }}</mat-icon>
    </button>
  }
</ng-template>

<main class="page">
  <router-outlet />
</main>

<!-- Last, small, and always there: whether what you are looking at is current. -->
<footer class="build" [title]="'built ' + builtAt">build {{ build.sha }} · {{ builtAt }}</footer>
