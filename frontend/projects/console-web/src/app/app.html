<mat-toolbar color="primary" class="bar">
  <!-- Two screens, two bars, and the difference between them is the whole point:
       the list is where you are, a session is somewhere you went. Material's top
       app bar says that with a leading navigation icon, a headline naming the
       current screen, and actions at the end — so that is what each branch is.

       ⚠ **The name is the headline, not a control.** It used to be a button on
       the RIGHT that opened the details sheet, which put the identity of the
       screen where the actions belong and made the title a thing to press. The
       sheet did not go away; it is the first item in the ⋮ menu, where the rest
       of what can be done to this session already lived.

       What the name replaced, back when this was written: the working directory
       printed across the top of every session — three lines of shared prefix
       around the one word that differed, because every session on this Mac runs
       under one tree. The path is still in the sheet, with the model id, the
       permission mode in words and the session id, none of which were readable
       on a phone before: they were `title=` tooltips. -->
  @if (here.open(); as open) {
    <!-- Up, to the list. ⚠ **A `button`, not an `a`** — the app-wide rule that
         centres a glyph in its circle is `button[matIconButton]`, an element
         selector, so an anchor would take the directive and miss the fix. The
         router does the navigating either way. -->
    <button matIconButton class="leave" routerLink="/" aria-label="all sessions">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="name" [class.anonymous]="!open.name">{{ title() }}</h1>
    <span class="spacer"></span>
    <button
      matIconButton
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="'what to do with ' + (open.name ?? 'this session')"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="session-menu">
      <!-- First, because it is the only item here that reads rather than acts:
           somebody opening this menu to find out what they are looking at should
           not have to pass six things that change it on the way. -->
      <button mat-menu-item aria-haspopup="dialog" (click)="details(open)">
        <mat-icon>info</mat-icon>
        <span>Details</span>
      </button>
      <mat-divider />
      <div class="heading">Asks permission</div>
      <!-- The CLI's own modes in its own escalation order, least allowed first,
           so the list reads as a dial rather than a set. Each carries the icon
           that stands for it elsewhere — this menu is the only place both are
           shown, so it is where the icons are learnt. -->
      @for (mode of modes; track mode.mode) {
        <button mat-menu-item (click)="setMode(mode.mode)">
          <mat-icon [class.loud]="mode.loud">{{ mode.icon }}</mat-icon>
          <span [class.loud]="mode.loud">{{ mode.title }}</span>
          @if (mode.mode === open.mode) {
            <mat-icon class="ticked">check</mat-icon>
          }
        </button>
      }
      @if (open.alive) {
        <!-- Last, and behind a divider: ending a session is the one thing here
             that cannot be undone, and it is wanted about as often. -->
        <mat-divider />
        <button mat-menu-item (click)="stop(open.id)">
          <mat-icon>stop</mat-icon>
          <span>Stop this session</span>
        </button>
      }
    </mat-menu>
  } @else {
    <!-- The root. No navigation icon, because there is nowhere above it, and no
         actions: a menu of things to do to no session is a menu of nothing.
         Before the name was here this said "this Mac", which was true of every
         session on the list and news to nobody. -->
    <mat-icon>terminal</mat-icon>
    <h1 class="title">console</h1>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

<!-- Last, small, and always there: the answer to "is what I am looking at
     current?", which on a phone that freezes and caches its pages is asked
     often and could not be answered before. -->
<footer class="build" [title]="'built ' + builtAt">build {{ build.sha }} · {{ builtAt }}</footer>
