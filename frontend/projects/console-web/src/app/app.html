<mat-toolbar color="primary" class="bar">
  <a routerLink="/" class="home" aria-label="all sessions">
    <mat-icon>terminal</mat-icon>
    <span class="title">console</span>
  </a>
  <span class="spacer"></span>
  <!-- Which agent you are talking to, when you are inside one. The console
       drives a dozen at once and they differ only by name, so that is the fact
       worth the space; "this Mac" is true and tells you nothing you did not
       already know. Falls back to it on the list, where no one session is in
       view — and there it stays a label, because a menu of things to do to no
       session is a menu of nothing. -->
  @if (here.open(); as open) {
    <button matButton class="where" [matMenuTriggerFor]="menu">
      {{ open.name ?? 'this session' }}
      <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="session-menu">
      <div class="heading">Asks permission</div>
      <!-- The CLI's own modes in its own escalation order, least allowed first,
           so the list reads as a dial rather than a set. Each carries the icon
           that stands for it elsewhere — this menu is the only place both are
           shown, so it is where the icons are learnt. -->
      @for (mode of modes; track mode.mode) {
        <button mat-menu-item (click)="setMode(mode.mode)">
          <mat-icon [class.loud]="mode.loud">{{ mode.icon }}</mat-icon>
          <span [class.loud]="mode.loud">{{ mode.title }}</span>
          @if (mode.mode === open.mode) {
            <mat-icon class="ticked">check</mat-icon>
          }
        </button>
      }
      @if (open.alive) {
        <!-- Last, and behind a divider: ending a session is the one thing here
             that cannot be undone, and it is wanted about as often. -->
        <mat-divider />
        <button mat-menu-item (click)="stop(open.id)">
          <mat-icon>stop</mat-icon>
          <span>Stop this session</span>
        </button>
      }
    </mat-menu>
  } @else {
    <span class="where">this Mac</span>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

<!-- Last, small, and always there: the answer to "is what I am looking at
     current?", which on a phone that freezes and caches its pages is asked
     often and could not be answered before. -->
<footer class="build" [title]="'built ' + builtAt">build {{ build.sha }} · {{ builtAt }}</footer>
