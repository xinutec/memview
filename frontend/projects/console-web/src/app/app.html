<mat-toolbar color="primary" class="bar">
  <!-- Two screens, two bars, and the difference between them is the whole point:
       the list is where you are, a session is somewhere you went. Material's top
       app bar says that with a leading navigation icon, a headline naming the
       current screen, and actions at the end — so that is what each branch is.

       ⚠ **The name is the headline, not a control.** It used to be a button on
       the RIGHT that opened the details sheet, which put the identity of the
       screen where the actions belong and made the title a thing to press. The
       sheet did not go away; it is the first item in the ⋮ menu, where the rest
       of what can be done to this session already lived.

       What the name replaced, back when this was written: the working directory
       printed across the top of every session — three lines of shared prefix
       around the one word that differed, because every session on this Mac runs
       under one tree. The path is still in the sheet, with the model id, the
       permission mode in words and the session id, none of which were readable
       on a phone before: they were `title=` tooltips. -->
  <!-- ⚠ **Which branch, from the ROUTE rather than from the runner's reply.**
       `here.open()` is a summary and arrives a round trip later — and a cold
       launch reopens straight inside a conversation, so for that round trip the
       shell drew the LIST's bar and then swapped the whole row. Visible as a
       flash of `console` on entering the app. See `here.ts`. -->
  @if (here.at()) {
    <!-- Up, to the list. ⚠ **A `button`, not an `a`** — the app-wide rule that
         centres a glyph in its circle is `button[matIconButton]`, an element
         selector, so an anchor would take the directive and miss the fix. The
         router does the navigating either way. -->
    <button matIconButton class="leave" routerLink="/" aria-label="all sessions">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="name" [class.anonymous]="anonymous()">{{ title() }}</h1>
    <span class="spacer"></span>
    <ng-container [ngTemplateOutlet]="keepAwake" />
    <!-- The one thing here that does have to wait: every item in this menu acts
         on a session, and until the summary lands there is nothing to act on.
         An empty ⋮ that silently does nothing is worse than one that arrives a
         moment late. -->
    @if (here.open(); as open) {
      <button
        matIconButton
        [matMenuTriggerFor]="menu"
        [attr.aria-label]="'what to do with ' + (open.name ?? 'this session')"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <!-- ⚠ **The count no longer costs a tap.** This menu used to fetch the
           session's whole list when it opened — 63 kB for a session with 355
           tasks — because a count on the five-second poll would have meant
           reading a megabyte a minute. The runner counts every session it can
           see in 1.4 ms of stats now (`console/src/tasks.rs`), so the numbers
           ride the poll, the label is right the moment the menu opens, and the
           front page can show the same two numbers per row. -->
      <mat-menu #menu="matMenu" class="session-menu">
        <!-- First, because it is the only item here that reads rather than acts:
           somebody opening this menu to find out what they are looking at should
           not have to pass six things that change it on the way. -->
        <button mat-menu-item aria-haspopup="dialog" (click)="details(open)">
          <mat-icon>info</mat-icon>
          <span>Details</span>
        </button>
        <!-- The other reading item, beside it. The session's own list, which it
             keeps whether anybody looks or not — see [[TasksSheet]]. -->
        <button mat-menu-item aria-haspopup="dialog" (click)="tasks(open)">
          <mat-icon>checklist</mat-icon>
          <!-- Open over total, so the sheet does not have to be opened to learn
               whether anything is left. Absent until counted and absent for a
               session that never kept a list — `0/0` would be a claim, where
               nothing is the truth. -->
          <span>Tasks</span>
          @if (taskCount(); as count) {
            <span class="tally">{{ count.open }}/{{ count.total }}</span>
          }
        </button>
        <!-- ⚠ **Here rather than as a `/rename`.** A slash command sent to a
             working session is parked and handed to the model as words, so the
             name never changes — measured. This goes over the control channel
             and takes effect mid-turn. See `protocol::rename`. -->
        <button mat-menu-item (click)="rename(open)">
          <mat-icon>edit</mat-icon>
          <span>Rename</span>
        </button>
        <!-- ⚠ **One row, not six.** The modes used to be listed inline here,
             under a heading — most of the menu, so the two things it is actually
             opened for sat above a wall of settings. The current one is on the
             row, which is the only part anybody needed to see without opening
             anything. See [[ModesSheet]]. -->
        <button mat-menu-item (click)="chooseMode(open)">
          <!-- The mode's own icon when there is one, so the state is readable
               without opening anything — and a neutral one when the runner has
               not said, rather than the empty circle that left. -->
          <mat-icon [class.loud]="loud()">{{ modeIcon() ?? 'shield' }}</mat-icon>
          <span>Asks permission</span>
          @if (mode(); as now) {
            <span class="current" [class.loud]="loud()">{{ now }}</span>
          }
        </button>
        @if (open.alive) {
          <!-- Last, and behind a divider: ending a session is the one thing here
             that cannot be undone, and it is wanted about as often. -->
          <mat-divider />
          <button mat-menu-item (click)="stop(open.id)">
            <mat-icon>stop</mat-icon>
            <span>Stop this session</span>
          </button>
        }
      </mat-menu>
    }
  } @else {
    <!-- The root. No navigation icon, because there is nowhere above it, and no
         actions: a menu of things to do to no session is a menu of nothing.
         Before the name was here this said "this Mac", which was true of every
         session on the list and news to nobody. -->
    <mat-icon>terminal</mat-icon>
    <h1 class="title">console</h1>
    <span class="spacer"></span>
    <ng-container [ngTemplateOutlet]="keepAwake" />
  }
</mat-toolbar>

<!-- ⚠ **On both screens, and one template rather than two copies.** Watching is
     what this app is for and it is done with no hands: the display timeout has
     no way to tell looking from idling, so the screen darkens mid-answer and
     waking it by hand is also the gesture that stops the transcript following.
     The choice belongs wherever you are when you make it — a session you are
     about to watch, or the list you are about to pick one from — and a second
     copy of the markup is a second thing to forget when either changes.

     Absent, not disabled, where the browser has no wake lock: 412px of toolbar
     is already three controls and a name that has to be allowed to lose, and a
     button that cannot do anything is the one thing there that need not be. -->
<ng-template #keepAwake>
  @if (awake.possible) {
    <button
      matIconButton
      class="awake"
      [attr.aria-pressed]="awake.lit()"
      [attr.aria-label]="awake.lit() ? 'let the screen sleep' : 'keep the screen on'"
      (click)="awake.toggle()"
    >
      <!-- A moon the screen may go to sleep under, struck through while it may
           not. Two glyphs rather than one tinted glyph, because the state has to
           be readable at a glance in daylight and a tint on a coloured toolbar
           is not — and a struck-through icon already means "this is suppressed"
           in this bar, where `notifications_off` stands for Don't Ask.

           ⚠ **Not `lightbulb`/`lightbulb_outline`, which was the first choice.**
           `lightbulb_outline` is in `material-icons/css/_codepoints.scss` and NOT
           in the ligature font `angular.json` actually bundles
           (`iconfont/filled.css`) — so it would have painted the literal word
           across the toolbar. DL-ANGULAR-ICON-EXISTS caught it; the inventory it
           reads, `material-icons/_data/versions.json`, is the one to check. -->
      <mat-icon>{{ awake.lit() ? 'bedtime_off' : 'bedtime' }}</mat-icon>
    </button>
  }
</ng-template>

<main class="page">
  <router-outlet />
</main>

<!-- Last, small, and always there: the answer to "is what I am looking at
     current?", which on a phone that freezes and caches its pages is asked
     often and could not be answered before. -->
<footer class="build" [title]="'built ' + builtAt">build {{ build.sha }} · {{ builtAt }}</footer>
