<mat-toolbar color="primary" class="bar">
  <a routerLink="/" class="home" aria-label="all sessions">
    <mat-icon>terminal</mat-icon>
    <span class="title">console</span>
  </a>
  <span class="spacer"></span>
  <!-- Which conversation this is, and what can be done to it: the two things
       that are true of the whole screen rather than of any part of it, so they
       live in the one row that is always there.
       ⚠ **The name is a control, not a caption.** It replaced the working
       directory printed across the top of every session — three lines of shared
       prefix around the one word that differed, because every session on this
       Mac runs under one tree. The path did not go away; it is behind this,
       with the model id, the permission mode in words and the session id, none
       of which were readable on a phone before: they were `title=` tooltips.
       Before either, this said "this Mac" on the list. Nothing takes its place
       there — a menu of things to do to no session is a menu of nothing. -->
  @if (here.open(); as open) {
    <!-- ⚠ **Not `matButton`.** Material's button wraps its content in a label
         span that is a flex item with `min-width: auto` and `overflow: visible`
         — so a name too long for the row does not shorten, it SPILLS out of the
         button on both sides: measured at 339px of text in a 223px control,
         painted straight over the `console` link 69px to its left. The only
         selector that could constrain it is Material's own internal class,
         which is exactly what DL-SCSS-INTERNAL-OVERRIDE forbids. A button we own
         has a box we can constrain. -->
    <button type="button" class="named" aria-haspopup="dialog" (click)="details(open)">
      <span class="name" [class.anonymous]="!open.name">{{ title() }}</span>
      <mat-icon>info</mat-icon>
    </button>
    <button
      matIconButton
      [matMenuTriggerFor]="menu"
      [attr.aria-label]="'what to do with ' + (open.name ?? 'this session')"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="session-menu">
      <div class="heading">Asks permission</div>
      <!-- The CLI's own modes in its own escalation order, least allowed first,
           so the list reads as a dial rather than a set. Each carries the icon
           that stands for it elsewhere — this menu is the only place both are
           shown, so it is where the icons are learnt. -->
      @for (mode of modes; track mode.mode) {
        <button mat-menu-item (click)="setMode(mode.mode)">
          <mat-icon [class.loud]="mode.loud">{{ mode.icon }}</mat-icon>
          <span [class.loud]="mode.loud">{{ mode.title }}</span>
          @if (mode.mode === open.mode) {
            <mat-icon class="ticked">check</mat-icon>
          }
        </button>
      }
      @if (open.alive) {
        <!-- Last, and behind a divider: ending a session is the one thing here
             that cannot be undone, and it is wanted about as often. -->
        <mat-divider />
        <button mat-menu-item (click)="stop(open.id)">
          <mat-icon>stop</mat-icon>
          <span>Stop this session</span>
        </button>
      }
    </mat-menu>
  }
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>

<!-- Last, small, and always there: the answer to "is what I am looking at
     current?", which on a phone that freezes and caches its pages is asked
     often and could not be answered before. -->
<footer class="build" [title]="'built ' + builtAt">build {{ build.sha }} · {{ builtAt }}</footer>
