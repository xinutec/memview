<h2 class="who">{{ file }}</h2>
<p class="where">{{ folder }}</p>
@if (change.everywhere) {
  <p class="note">Every occurrence in the file.</p>
}
<!-- Wraps rather than scrolling sideways, which fights the sheet's own swipe. -->
<pre
  class="diff"
><code>@for (line of lines; track $index) {<span class="line" [class]="line.kind">{{ mark[line.kind] }} {{ line.text }}</span>}</code></pre>
