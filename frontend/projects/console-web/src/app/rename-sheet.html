<h2 class="what">Rename this conversation</h2>

@if (trouble(); as what) {
  <p class="trouble">{{ what }}</p>
}

<mat-form-field appearance="outline" class="title">
  <mat-label>name</mat-label>
  <!-- No placeholder: in an outline field it shows only once the label has floated,
       after the decision to type. -->
  <input matInput [(ngModel)]="title" (keydown.enter)="save()" />
</mat-form-field>

<!-- What a model would call it, from the second line of the same Haiku call that
     writes the card's sentence. A button, not a `mat-chip`: Angular's interactive
     chips carry selection semantics, and this fills a field once (see
     `reference_angular_material_m3_gaps`). Marked as a guess — a name is stickier
     than a summary. -->
@if (suggestion(); as name) {
  <button
    matButton
    class="offer"
    type="button"
    (click)="accept(name)"
    [attr.aria-label]="'use the suggested name ' + name + ', written by a model'"
    title="written by Haiku from the transcript — tap to use it, then edit"
  >
    <mat-icon>auto_awesome</mat-icon>
    {{ name }}
  </button>
}

<!-- Works while the session is busy, which `/rename` does not — see `protocol::rename`. -->
<button matButton="filled" class="go" (click)="save()" [disabled]="saving() || !title().trim()">
  <mat-icon>label</mat-icon>
  {{ saving() ? 'renaming…' : 'rename' }}
</button>
