<h2 class="what">Asks permission</h2>

<!-- The CLI's own modes in its escalation order, least allowed first, each with
     the icon that stands for it elsewhere — this is where the icons are learnt. -->
@for (mode of modes; track mode.mode) {
  <button
    type="button"
    class="mode"
    [class.taken]="mode.mode === chosen()"
    [attr.aria-pressed]="mode.mode === chosen()"
    (click)="pick(mode.mode)"
  >
    <mat-icon [class.loud]="mode.loud">{{ mode.icon }}</mat-icon>
    <span class="label" [class.loud]="mode.loud">{{ mode.title }}</span>
    @if (mode.mode === chosen()) {
      <mat-icon class="ticked">check</mat-icon>
    }
  </button>
}
