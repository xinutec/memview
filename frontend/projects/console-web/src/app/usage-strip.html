@if (usage()) {
  <section class="usage" aria-label="subscription usage">
    @for (bar of bars(); track bar.label) {
      <div class="window">
        <span class="label">{{ bar.label }}</span>
        @if (bar.left; as left) {
          <span class="pct" [class]="bar.pace">{{ bar.pct }}%</span>
          <!-- The bar and its markers share one box: positions ON the level. -->
          <span class="level">
            <mat-progress-bar
              [class]="bar.pace"
              mode="determinate"
              [value]="bar.pct"
              [attr.aria-label]="bar.label + ' used'"
            />
            @for (at of bar.days; track at) {
              <i class="day" [style.left.%]="at" aria-hidden="true"></i>
            }
            @if (bar.elapsed; as at) {
              <!-- Where the clock is, against where the spend is: fill behind the mark is room
                   to spare. Titled rather than labelled — a phone has no hover. -->
              <i
                class="clock"
                [style.left.%]="at"
                [attr.title]="at.toFixed(0) + '% of the window has passed'"
                aria-hidden="true"
              ></i>
            }
          </span>
          <span class="left">{{ left }}</span>
        } @else {
          <!-- Not the last figure, and not zero: the window has turned over since, and this
               console is normally hours behind. -->
          <span class="gone" [attr.title]="'the ' + bar.label + ' window has reset since'"
            >reset since</span
          >
        }
      </div>
    }
    <!-- Which machine, and how old: the host is the only local part of an
         account-wide number. -->
    <p class="taken">{{ usage()?.host }} · {{ taken() }}</p>
  </section>
}
