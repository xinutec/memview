[package]
# Adding the enrolment tool made `cargo run -p console` ambiguous, which is how
# memview learned this once already: the server is the default, the tool is asked
# for by name.
default-run = "console"
name = "console"
version = "0.1.0"
edition = "2024"

# A front end for the live Claude Code sessions on this Mac: read what they are
# doing, send them instructions, and (later) approve what they want to run.
#
# It deliberately depends on nothing from the `memview` package beside it. The
# viewer is read-only over documents and runs on an internet-facing host; this
# spawns subprocesses on the root-of-truth machine. Sharing a repository is fine
# — sharing a binary or a library would put the two privilege levels one
# configuration mistake apart. See ../docs/agent-console.md.

[dependencies]
# ⚠ **The locks, and not `std::sync`'s.** A std lock poisons when a thread panics
# holding it, and every later reader gets an `Err` saying only "somebody else
# crashed". Nothing here can act on that — the console's state is rebuilt by
# re-reading the sessions on disk — so every call site unwrapped it, which put a
# message nobody can use beside every lock in the crate. These do not poison.
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# The hunks a Bash call changed, from the files before and after it — see src/edits.rs.
similar = "2"
# Thumbnails, so a picture in a transcript costs the phone tens of kilobytes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# The one thing shared with the viewer beside it, and it is not the viewer: a
# leaf that runs nothing, serves nothing and opens nothing. The rule about which
# files under ~/.claude/projects are conversations lives there because getting it
# wrong here once already opened a 119 MB session as blank — see
# ../reader/src/transcript.rs. `reader/tests/leaf.rs` is what keeps it harmless
# to depend on from a process that spawns Claude Code.
reader = { path = "../reader" }
# For the descriptor work an upgrade needs: clearing close-on-exec, going
# non-blocking, and killing a session whose Child handle exec'd away.
libc = "0.2"

# TLS with a pinned client key. `ring` rather than the default aws-lc-rs
# provider: aws-lc needs cmake and a C toolchain in every environment that ever
# builds this, and the gate is a handful of signatures — not a place that wants a
# second build system.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls-pemfile = "2"
# Reading the public key out of a certificate, which is what is pinned — and, with
# `verify`, checking an attestation chain link by link at enrolment. It re-exports
# the asn1 layer the KeyDescription record is parsed with, so there is one version
# of that in the tree rather than two.
x509-parser = { version = "0.17", features = ["verify"] }
sha2 = "0.11"
# `sha2` 0.11's digest is an array with no `LowerHex`; `hex` spells it out.
hex = "0.4"
# One outbound GET, for a number this console cannot measure (see src/usage.rs).
# `rustls-no-provider` and not the default: the default provider is aws-lc-rs,
# which wants cmake and a C toolchain in every environment that ever builds
# this — the same reason the server side above pins `ring`, which main.rs
# installs. reqwest 0.13 verifies against the platform's trust store
# (rustls-platform-verifier); its 0.12 `webpki-roots` feature, which this once
# used so a fetch did not depend on how the Mac stores its roots, is gone.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "http2", "rustls-no-provider"] }
# RFC 3339 in the transcripts, read into epoch milliseconds. Already in the tree
# under x509-parser, so this is a direct name for a crate that is compiled either
# way rather than a new dependency.
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
# Decoding what the phone sends: the client already holds an image as base64 (a
# canvas hands back a data URL), so this is the one conversion on that path.
base64 = "0.23"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"], optional = true }
yrs = "0.28.0"

[dev-dependencies]
# Test certificates, made in the test rather than committed: a keypair in the
# repository is a keypair that outlives its purpose.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Reading the event stream back through the compression the phone asks for. A
# test that only checked bytes ARRIVED would pass on garbage; the claim is that a
# live event reaches the wire whole and promptly.
flate2 = "1"
# Backdating a fixture's mtime. The freshness half of the in-use guard cannot be
# tested by waiting two minutes.
filetime = "0.2"
yrs = "0.28.0"
base64 = "0.23"

[features]
ts = ["dep:ts-rs", "reader/ts"]

[lints]
workspace = true
