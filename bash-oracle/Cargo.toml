[package]
name = "bash-oracle"
version = "0.1.0"
edition = "2024"

# The second gate: bash printing its own parse, so the syntax tree has a check
# that is not itself. See docs/execution-model.md and src/lib.rs.
#
# ⚠ **A workspace member and not a module of `reader`, for the reason the
# console is one and not a feature of the viewer.** `reader` states that it runs
# nothing, opens nothing and touches no filesystem, and that claim is what lets
# both privilege levels link it. This crate spawns bash and writes a file. It
# depends on `reader`; nothing depends on it but its own binary, so the leaf
# stays a leaf.

[dependencies]
reader = { path = "../reader" }
anyhow = "1"
serde_json = "1"

# ⚠ **Declared only to say `test = false`.** Cargo builds a test harness for
# every bin and lib target and then runs it, and macOS assesses each freshly
# linked binary on its first execution — which costs far more than an empty
# harness is worth. Every test in this workspace lives in `tests/`, so none of
# these targets holds one. `scripts/tests-live-in-tests.sh` is a gate row, so a
# `#[test]` added to one of them fails rather than being silently skipped.
[lib]
test = false
doctest = false

[[bin]]
name = "syntax-report"
test = false
